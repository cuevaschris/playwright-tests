  api-testing-eviltester-site:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Create .env file
      run: echo "${{ secrets.DOTENV_FILE_CONTENT }}" > .env
      shell: bash
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      if: steps.pw-cache-id.output.cache-hit != 'true'
      run: npx playwright install --with-deps
    - name: Cache PW Dependencies 
      uses: actions/cache/save@v5
      id: pw-cache-id
      with:
        path: ~/.npm
        key: Playwright-Dependency-Cache-1
    - name: Run Playwright tests
      run: npm run run-api-testing
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: reports-cuevaschris-api/api-tests-all-runs_results
        path: reports-cuevaschris-api/api-tests-all-runs/
        retention-days: 30