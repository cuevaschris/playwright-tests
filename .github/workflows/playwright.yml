  api-testing-eviltester-site:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Create .env file
      run: echo "${{ secrets.DOTENV_FILE_CONTENT }}" > .env
      shell: bash

    - name: Cache Node modules
      id: node-cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      if: steps.node-cache.outputs.cache-hit != 'true'
      run: |
        npm ci
        npx playwright install --with-deps

    - name: Run Playwright testss
      run: npm run run-api-testing-on-linux
    - uses: actions/upload-artifact@v6
      if: ${{ !cancelled() }}
      with:
        name: api-results
        path: reports-cuevaschris-api/api-tests-all-runs
        retention-days: 30